name: Circadia
options:
  bundleIdPrefix: com.circadia
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Circadia:
    type: application
    platform: iOS
    sources:
      - path: Circadia
        excludes:
          - "Tests/**"
    info:
      path: Circadia/App/Info.plist
      properties:
        CFBundleDisplayName: Circadia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: "Circadia reads your sleep timing, time in daylight, heart rate variability, resting heart rate and wrist temperature to estimate your body-clock alignment and time its suggestions. Your data stays on this iPhone."
        NSCameraUsageDescription: "Light Check uses the camera to estimate how bright your surroundings are and the colour of the light. Frames are averaged on your phone and never recorded or saved."
        NSLocationWhenInUseUsageDescription: "Circadia uses your approximate location to find local sunrise, sunset and cloud cover so it can time outdoor-light suggestions, and to notice when you change time zones."
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.circadia.app.refresh
    entitlements:
      path: Circadia/App/Circadia.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.com.projectcircadia.app
    dependencies:
      - target: CircadiaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectcircadia.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V7Z23T9D5C
        ENABLE_PREVIEWS: YES
  CircadiaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: CircadiaWidgets
      - path: Circadia/Shared
    info:
      path: CircadiaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Circadia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CircadiaWidgets/CircadiaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.projectcircadia.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.projectcircadia.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: V7Z23T9D5C
        ENABLE_PREVIEWS: YES
  CircadiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Circadia/Tests
    dependencies:
      - target: Circadia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.circadia.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Circadia.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Circadia
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  Circadia:
    build:
      targets:
        Circadia: all
        CircadiaTests: [test]
    test:
      targets:
        - CircadiaTests
      gatherCoverageData: false
